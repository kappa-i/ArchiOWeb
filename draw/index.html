<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b7a8ff" />
    <title>Devin'Art · Dessin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <!-- GSAP : les petites animations élastiques (la page marche aussi sans) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script type="module" src="app.js"></script>
  </head>

  <body>
    <div class="backdrop" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <div class="app" id="app">
      <!-- Barre du haut : mascotte, room, mot à dessiner, joueurs, minuteur -->
      <header class="hud">
        <div class="brand">
          <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <radialGradient id="mascot-body" cx="38%" cy="34%" r="72%">
                <stop offset="0" stop-color="#d6c7ff" />
                <stop offset="0.55" stop-color="#9c7bff" />
                <stop offset="1" stop-color="#6a47e8" />
              </radialGradient>
            </defs>
            <g class="mascot-figure">
              <path
                d="M32 13c13.5 0 24 9.4 24 23S46 58 32 58 8 49.6 8 36s10.5-23 24-23z"
                fill="url(#mascot-body)"
              />
              <ellipse
                cx="21"
                cy="26"
                rx="6"
                ry="3.2"
                fill="#fff"
                opacity=".55"
                transform="rotate(-32 21 26)"
              />
              <ellipse
                cx="31"
                cy="14.5"
                rx="17"
                ry="5.5"
                fill="#ff5c8a"
                transform="rotate(-9 31 14.5)"
              />
              <circle cx="30" cy="8" r="2.8" fill="#ff5c8a" />
              <g class="mascot-eyes">
                <ellipse cx="25" cy="36" rx="3.4" ry="4.4" fill="#2b2350" />
                <ellipse cx="39" cy="36" rx="3.4" ry="4.4" fill="#2b2350" />
                <circle cx="26.2" cy="34.3" r="1.25" fill="#fff" />
                <circle cx="40.2" cy="34.3" r="1.25" fill="#fff" />
              </g>
              <ellipse cx="18" cy="43" rx="4" ry="2.4" fill="#ff8fc4" opacity=".8" />
              <ellipse cx="46" cy="43" rx="4" ry="2.4" fill="#ff8fc4" opacity=".8" />
              <path
                d="M28.5 43.5q3.5 3.6 7 0"
                fill="none"
                stroke="#2b2350"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </g>
          </svg>
          <span class="brand-name">Devin'<span>Art</span></span>
        </div>

        <div class="room pill">
          <span class="status" id="status">
            <span class="status-dot"></span>
            <span id="status-text">Solo</span>
          </span>
          <span class="room-code">Room <strong id="room-code">DEMO</strong></span>
          <button class="icon-button" id="invite" aria-label="Copier le lien pour inviter">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 13.5a4.5 4.5 0 0 0 6.4.4l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.3 1.3" />
              <path d="M14 10.5a4.5 4.5 0 0 0-6.4-.4l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.3-1.3" />
            </svg>
          </button>
        </div>

        <div class="word-card pill">
          <span class="word-label" id="word-label">À toi de dessiner</span>
          <div class="word" id="word"></div>
          <button class="icon-button" id="reroll" aria-label="Changer de mot">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="3.5" width="17" height="17" rx="4.5" />
              <circle class="icon-fill" cx="8.5" cy="8.5" r="1.4" />
              <circle class="icon-fill" cx="12" cy="12" r="1.4" />
              <circle class="icon-fill" cx="15.5" cy="15.5" r="1.4" />
            </svg>
          </button>
        </div>

        <div class="players pill" id="players" aria-label="Joueurs connectés"></div>

        <div class="timer" id="timer" role="timer" aria-label="Temps restant">
          <svg viewBox="0 0 60 60" aria-hidden="true">
            <circle class="timer-track" cx="30" cy="30" r="26" />
            <circle class="timer-progress" id="timer-progress" cx="30" cy="30" r="26" />
          </svg>
          <span class="timer-value" id="timer-value">80</span>
        </div>
      </header>

      <!-- Outils -->
      <nav class="toolbar glass" aria-label="Outils">
        <button class="tool" data-tool="brush" data-tip="Pinceau · B" aria-label="Pinceau">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 20l1.1-4.6L15.6 4.9a2.2 2.2 0 0 1 3.1 0l.4.4a2.2 2.2 0 0 1 0 3.1L8.6 18.9z"
            />
            <path d="M13.5 7l3.5 3.5" />
          </svg>
          <span class="tool-color"></span>
        </button>
        <button class="tool" data-tool="eraser" data-tip="Gomme · E" aria-label="Gomme">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 20h11" />
            <path
              d="M5.2 14.8 14.4 5.6a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L10 20H8.4l-3.2-3.2a1.4 1.4 0 0 1 0-2z"
            />
            <path d="m9.8 10.2 4.8 4.8" />
          </svg>
        </button>
        <button class="tool" data-tool="fill" data-tip="Remplir · F" aria-label="Pot de peinture">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11.5 4.5 4.6 11.4a1.8 1.8 0 0 0 0 2.5l4.9 4.9a1.8 1.8 0 0 0 2.5 0l6.9-6.9z" />
            <path d="M4.5 12.5h14" />
            <path d="m11.5 4.5-2-2" />
            <path d="M20.5 15c1 1.4 1.6 2.4 1.6 3.1a1.6 1.6 0 0 1-3.2 0c0-.7.6-1.7 1.6-3.1z" />
          </svg>
        </button>
        <button class="tool" data-tool="shape" data-tip="Formes · S" aria-label="Formes">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="9" r="5.5" />
            <rect x="11" y="11" width="9.5" height="9.5" rx="2" />
          </svg>
        </button>

        <span class="toolbar-separator"></span>

        <button class="tool" id="undo" data-tip="Annuler · Ctrl+Z" aria-label="Annuler">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14.5 4 9.5l5-5" />
            <path d="M4 9.5h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg>
        </button>
        <button class="tool" id="redo" data-tip="Rétablir · Ctrl+Y" aria-label="Rétablir">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 14.5 5-5-5-5" />
            <path d="M20 9.5H9.5a5.5 5.5 0 0 0 0 11H13" />
          </svg>
        </button>
        <button
          class="tool tool-danger"
          id="clear"
          data-tip="Tout effacer"
          aria-label="Tout effacer"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M9.5 7V4.5h5V7" />
            <path d="M6 7l.9 12.1A2 2 0 0 0 8.9 21h6.2a2 2 0 0 0 2-1.9L18 7" />
            <path d="M10 11v6M14 11v6" />
          </svg>
        </button>
      </nav>

      <!-- La feuille de dessin -->
      <main class="stage">
        <div class="paper" id="paper">
          <span class="tape tape-left"></span>
          <span class="tape tape-right"></span>

          <div class="sheet" id="sheet">
            <canvas id="board" aria-label="Feuille de dessin"></canvas>
            <canvas id="overlay" aria-hidden="true"></canvas>
            <div class="brush-cursor" id="brush-cursor"></div>

            <div class="watching" id="watching" hidden>
              <span id="drawer-name">Quelqu'un</span> dessine…
            </div>

            <div class="round-over" id="round-over" hidden>
              <div class="round-over-card" id="round-over-card">
                <svg class="mascot mascot-big" viewBox="0 0 64 64" aria-hidden="true">
                  <defs>
                    <radialGradient id="mascot-body-2" cx="38%" cy="34%" r="72%">
                      <stop offset="0" stop-color="#d6c7ff" />
                      <stop offset="0.55" stop-color="#9c7bff" />
                      <stop offset="1" stop-color="#6a47e8" />
                    </radialGradient>
                  </defs>
                  <path
                    d="M32 13c13.5 0 24 9.4 24 23S46 58 32 58 8 49.6 8 36s10.5-23 24-23z"
                    fill="url(#mascot-body-2)"
                  />
                  <ellipse
                    cx="21"
                    cy="26"
                    rx="6"
                    ry="3.2"
                    fill="#fff"
                    opacity=".55"
                    transform="rotate(-32 21 26)"
                  />
                  <ellipse
                    cx="31"
                    cy="14.5"
                    rx="17"
                    ry="5.5"
                    fill="#ff5c8a"
                    transform="rotate(-9 31 14.5)"
                  />
                  <circle cx="30" cy="8" r="2.8" fill="#ff5c8a" />
                  <circle cx="25" cy="35" r="4.6" fill="#fff" />
                  <circle cx="39" cy="35" r="4.6" fill="#fff" />
                  <circle cx="25.6" cy="35.6" r="2.4" fill="#2b2350" />
                  <circle cx="39.6" cy="35.6" r="2.4" fill="#2b2350" />
                  <ellipse cx="32" cy="46" rx="3.2" ry="3.8" fill="#2b2350" />
                </svg>
                <h2>Temps écoulé !</h2>
                <p>Le mot était <strong id="round-word"></strong></p>
                <button class="big-button" id="new-round">Nouvelle manche</button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Couleurs, tailles, types de pinceau et formes -->
      <aside class="panel glass" aria-label="Options de dessin">
        <section class="panel-section">
          <h3 class="panel-title">Couleur</h3>
          <div class="swatches" id="swatches"></div>
        </section>

        <div class="panel-row">
          <section class="panel-section" id="size-section">
            <h3 class="panel-title">Taille</h3>
            <div class="sizes" id="sizes"></div>
          </section>

          <!-- Les 3 sections sont superposées : le panneau garde la même taille quand on change d'outil -->
          <div class="options">
            <section class="panel-section" id="brush-section">
              <h3 class="panel-title">Pinceau</h3>
              <div class="brushes" id="brushes"></div>
            </section>

            <section class="panel-section is-hidden" id="shape-section">
              <h3 class="panel-title">Forme</h3>
              <div class="shapes" id="shapes"></div>
            </section>

            <section class="panel-section is-hidden" id="hint-section">
              <h3 class="panel-title">Astuce</h3>
              <p class="hint" id="hint"></p>
            </section>
          </div>
        </div>
      </aside>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
  </body>
</html>
