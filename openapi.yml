openapi: '3.1.0'

info:
  title: Devin'Art API
  description: >-
    REST API of **Devin'Art**, a multiplayer draw-and-guess game.
    One player draws a secret word while the others try to guess it as fast as possible.


    **Authentication:** log in with `POST /auth/login` to get a token, then send it
    in the `Authorization: Bearer <token>` header of protected requests.
    Tokens expire after 7 days.
  version: 0.1.0

servers:
  - url: https://devinart-8z4w.onrender.com
    description: Production server (Render)
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: auth
    description: Authentication
  - name: users
    description: User accounts
  - name: rooms
    description: Game rooms
  - name: participants
    description: Players of a room
  - name: drawings
    description: Drawings of a game, and the guesses of the players

paths:
  /auth/login:
    post:
      summary: Log in.
      description: Returns a token to authenticate the next requests.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        200:
          description: The credentials are valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          description: The email or the password is wrong.
          headers:
            WWW-Authenticate:
              $ref: '#/components/headers/WWW-Authenticate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid email or password

  /users:
    post:
      summary: Register a new user.
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        201:
          description: The user was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/ValidationError'

  /users/me:
    get:
      summary: Get the authenticated user.
      tags:
        - users
      security:
        - bearerAuth: []
      responses:
        200:
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/UserNotFound'
    patch:
      summary: Update the authenticated user.
      description: Only the fields sent in the body are modified.
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        200:
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/UserNotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete the authenticated user.
      description: >-
        The user first leaves every room they are in (same rules as `DELETE /rooms/{code}/participants/{id}`:
        the host role goes to the next player, and a room without players is deleted).
        Then the account and the results of their games are deleted.
      tags:
        - users
      security:
        - bearerAuth: []
      responses:
        204:
          description: The user was deleted, with the results of their games.
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/UserNotFound'

  /users/{id}/stats:
    get:
      summary: Get the stats of a player.
      description: >-
        Computed with a MongoDB aggregation on the results of the games the player finished.
        A player who has not finished any game gets stats at zero.
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        200:
          description: The stats of the player.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        404:
          description: No user has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: User not found
  /users/leaderboard:
    get:
      summary: Get the paginated player leaderboard.
      description: >-
        Players are ranked by their total points in the selected period
        (`day`, `week` and `month` cover the last 24 hours, 7 days and 30 days).
        Players without results in the selected period are not included.
        Each player gets their stats in the period, the places won or lost in the last 24 hours (`movement`)
        and their current win streak (`winStreak`).
        With `search`, only the players whose username contains the text are returned,
        and they keep their rank in the whole leaderboard.
      tags:
        - users
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of players per page, from 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - $ref: '#/components/parameters/LeaderboardPeriod'
        - name: search
          in: query
          required: false
          description: Only the players whose username contains this text (case insensitive).
          schema:
            type: string
            example: ali
      responses:
        200:
          description: The requested page of the leaderboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        400:
          description: One or more query parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPeriod:
                  value:
                    message: period must be all, month, week or day
                invalidPage:
                  value:
                    message: page must be a positive integer
                pageSizeTooLarge:
                  value:
                    message: pageSize must be at most 100
                invalidSearch:
                  value:
                    message: search must be a string

  /users/leaderboard/highlights:
    get:
      summary: Get the podium and the trends of the leaderboard.
      description: >-
        For the selected period: the 3 best players (same fields as the leaderboard),
        the leader and since when they are first (`since` is null if several players are tied at the top),
        the player who won the most places in the last 24 hours,
        and the longest current win streak (at least 2 wins in a row).
        Each trend is null when nobody matches it.
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/LeaderboardPeriod'
      responses:
        200:
          description: The podium and the trends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardHighlights'
        400:
          description: The period is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: period must be all, month, week or day

  /rooms:
    post:
      summary: Create a room.
      description: >-
        The authenticated user becomes the host of the room, and its first player.
        A unique 6-character code is generated, and the settings get their default values.
      tags:
        - rooms
      security:
        - bearerAuth: []
      responses:
        201:
          description: The room was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/UserNotFound'

  /rooms/{code}:
    get:
      summary: Get a room.
      description: Only the players of the room can see it.
      tags:
        - rooms
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      responses:
        200:
          description: The room, with its settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/NotAPlayer'
        404:
          $ref: '#/components/responses/RoomNotFound'
    patch:
      summary: Start the game.
      description: >-
        Only the host can do it. The status goes from `waiting` to `playing`.
        At least 2 players (not excluded) are needed.
        The server then plays the turns: 5 seconds later, the first player draws a random word,
        and the turns are sent to the players over WebSocket (see `draw/README.md`).
        At the end of the game, a result is saved for each player and the room is deleted.
      tags:
        - rooms
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomStart'
      responses:
        200:
          description: The room, with its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        400:
          description: 'The body is not `{ "status": "playing" }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'The body must be { "status": "playing" }'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/RoomNotFound'
        409:
          description: The game has already started, or there are less than 2 players.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: At least 2 players are needed to start the game

  /rooms/{code}/settings:
    patch:
      summary: Update the settings of a room.
      description: >-
        Only the host can do it, and only before the game has started.
        Only the fields sent in the body are modified.
        `maxPlayers` cannot be less than the number of players already in the room.
      tags:
        - rooms
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        200:
          description: The room, with its updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/RoomNotFound'
        409:
          description: >-
            The game has already started, or `maxPlayers` is less than the number of players already in the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                started:
                  value:
                    message: The game has already started
                tooManyPlayers:
                  value:
                    message: There are already 3 players in the room
        422:
          $ref: '#/components/responses/ValidationError'

  /rooms/{code}/participants:
    post:
      summary: Join a room.
      description: >-
        The authenticated user joins the room with its code.
        It is only possible before the game has started, if the room is not full,
        and if the user was not excluded from this room.
      tags:
        - participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      responses:
        201:
          description: The user joined the room.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: The user was excluded from this room by the host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: You were excluded from this room
        404:
          description: No room has this code, or the user of the token no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Room not found
        409:
          description: >-
            The user is already in the room, the game has already started, or the room is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The room is full
    get:
      summary: List the players of a room.
      description: >-
        Players are sorted by arrival (the first one is the earliest).
        Excluded players are not listed. Only the players of the room can see the list.
      tags:
        - participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      responses:
        200:
          description: The players of the room.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/NotAPlayer'
        404:
          $ref: '#/components/responses/RoomNotFound'

  /rooms/{code}/participants/{id}:
    patch:
      summary: Exclude a player.
      description: >-
        Only the host can do it. An excluded player cannot join the room again.
        The host cannot exclude themselves.
      tags:
        - participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
        - $ref: '#/components/parameters/ParticipantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantExclude'
      responses:
        200:
          description: The excluded player.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        400:
          description: 'The body is not `{ "excluded": true }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'The body must be { "excluded": true }'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: The user is not the host, or the host tries to exclude themselves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Only the host of the room can do this
        404:
          $ref: '#/components/responses/ParticipantNotFound'
    delete:
      summary: Leave a room.
      description: >-
        A player can only remove themselves.
        If the host leaves, the player who arrived the earliest becomes the new host.
        If the last player leaves, the room is deleted with its settings.
        During a game, if less than 2 players are left, the game ends right away:
        the remaining player gets their result, the players receive the `game-ended` message (WebSocket),
        and the room is deleted with all its content (drawings, guesses).
      tags:
        - participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        204:
          description: The player left the room.
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: The participant is not the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: You can only remove yourself from a room
        404:
          $ref: '#/components/responses/ParticipantNotFound'

  /rooms/{code}/drawings:
    get:
      summary: List the drawings of the game.
      description: >-
        One drawing per turn, sorted by start date.
        The word is only visible once the turn is finished.
        Only the players of the room can see the list.
      tags:
        - drawings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      responses:
        200:
          description: The drawings of the game.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drawing'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/NotAPlayer'
        404:
          $ref: '#/components/responses/RoomNotFound'

  /rooms/{code}/drawings/{id}/guesses:
    post:
      summary: Guess the word of a drawing.
      description: >-
        Only for the current drawing, and not for the player who draws.
        The comparison ignores uppercase letters, accents and spaces around.
        A right guess gives between 50 and 150 points (more if it is found earlier),
        and 25 points to the player who draws.
        Wrong guesses are sent to the other players (`guess` message), right ones without the word
        (`word-found` message). When everybody has found, the turn ends.
      tags:
        - drawings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
        - $ref: '#/components/parameters/DrawingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuessCreate'
      responses:
        201:
          description: The guess, right or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guess'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: The user is not a player of the room, or is the player who draws.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The drawer cannot guess
        404:
          $ref: '#/components/responses/DrawingNotFound'
        409:
          description: The turn of this drawing is finished, or the player already found the word.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This drawing is finished
        422:
          $ref: '#/components/responses/ValidationError'
    get:
      summary: List the guesses of a drawing.
      description: >-
        Sorted by date. During the turn, the content of the right guesses is hidden (`null`)
        so that the word stays secret. Only the players of the room can see the list.
      tags:
        - drawings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
        - $ref: '#/components/parameters/DrawingId'
      responses:
        200:
          description: The guesses of the drawing.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guess'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/NotAPlayer'
        404:
          $ref: '#/components/responses/DrawingNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: ID of the user.
      schema:
        type: string
        example: 66b9d6c2f1a2b3c4d5e6f7a8
    RoomCode:
      name: code
      in: path
      required: true
      description: Code of the room (case insensitive).
      schema:
        type: string
        example: K7PX2M
    ParticipantId:
      name: id
      in: path
      required: true
      description: ID of the participant (not the ID of the user).
      schema:
        type: string
        example: 66b9d6c2f1a2b3c4d5e6f7b0
    DrawingId:
      name: id
      in: path
      required: true
      description: ID of the drawing.
      schema:
        type: string
        example: 66b9d6c2f1a2b3c4d5e6f7c1
    LeaderboardPeriod:
      name: period
      in: query
      required: false
      description: >-
        Rolling period used to filter game results: all time,
        the last 30 days, the last 7 days or the last 24 hours.
      schema:
        type: string
        enum:
          - all
          - month
          - week
          - day
        default: all

  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        example: /users/66b9d6c2f1a2b3c4d5e6f7a8
    WWW-Authenticate:
      description: How to authenticate.
      schema:
        type: string
        example: Bearer

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7a8
        username:
          type: string
          example: jdoe
        email:
          type: string
          format: email
          example: jdoe@example.com
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - createdAt
        - updatedAt

    UserStats:
      type: object
      properties:
        userId:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7a8
        username:
          type: string
          example: jdoe
        player:
          type: object
          properties:
            gamesPlayed:
              type: integer
              example: 2
            wins:
              type: integer
              description: Games finished at rank 1.
              example: 1
            winRate:
              type: integer
              description: Percentage of games won (0 to 100, rounded).
              example: 50
            bestScore:
              type: integer
              example: 300
            averageScore:
              type: integer
              description: Rounded.
              example: 200
            totalPoints:
              type: integer
              example: 400
            lastGame:
              type:
                - string
                - 'null'
              format: date-time
              description: End date of the last game, null if no game was played.
          required:
            - gamesPlayed
            - wins
            - winRate
            - bestScore
            - averageScore
            - totalPoints
            - lastGame
        guesser:
          type: object
          properties:
            wordsFound:
              type: integer
              example: 4
            firstFinds:
              type: integer
              description: Times the player found the word first.
              example: 2
            averageFindTime:
              type: integer
              description: Average time to find a word, in seconds (rounded).
              example: 20
          required:
            - wordsFound
            - firstFinds
            - averageFindTime
        drawer:
          type: object
          properties:
            successfulDrawings:
              type: integer
              description: Drawings found by at least one player.
              example: 2
            drawingPoints:
              type: integer
              description: Points earned while drawing.
              example: 80
          required:
            - successfulDrawings
            - drawingPoints
      required:
        - userId
        - username
        - player
        - guesser
        - drawer

    LeaderboardPlayer:
      type: object
      properties:
        rank:
          type: integer
          description: Rank in the whole leaderboard of the period (1 = first).
          example: 1
        userId:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7a8
        username:
          type: string
          example: jdoe
        totalPoints:
          type: integer
          example: 450
        gamesPlayed:
          type: integer
          example: 5
        wins:
          type: integer
          description: Games finished at the first place.
          example: 2
        winRate:
          type: integer
          description: Percentage of games won, from 0 to 100.
          example: 40
        bestScore:
          type: integer
          example: 140
        wordsFound:
          type: integer
          example: 12
        firstFinds:
          type: integer
          description: Words found before every other player.
          example: 4
        successfulDrawings:
          type: integer
          description: Drawings found by at least one player.
          example: 3
        movement:
          type:
            - integer
            - 'null'
          description: >-
            Places won (positive) or lost (negative) compared to the same leaderboard 24 hours ago.
            Null if the player was not ranked 24 hours ago.
          example: 2
        winStreak:
          type: integer
          description: Wins in a row in the last games of the period (0 if the last game was not won).
          example: 2
      required:
        - rank
        - userId
        - username
        - totalPoints
        - gamesPlayed
        - wins
        - winRate
        - bestScore
        - wordsFound
        - firstFinds
        - successfulDrawings
        - movement
        - winStreak

    LeaderboardResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardPlayer'
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            pageSize:
              type: integer
              example: 10
            totalItems:
              type: integer
              example: 24
            totalPages:
              type: integer
              example: 3
          required:
            - page
            - pageSize
            - totalItems
            - totalPages
      required:
        - items
        - pagination

    LeaderboardHighlights:
      type: object
      properties:
        podium:
          type: array
          description: The 3 best players of the period (fewer if fewer players are ranked).
          maxItems: 3
          items:
            $ref: '#/components/schemas/LeaderboardPlayer'
        leader:
          type:
            - object
            - 'null'
          properties:
            userId:
              type: string
              example: 66b9d6c2f1a2b3c4d5e6f7a8
            username:
              type: string
              example: jdoe
            since:
              type:
                - string
                - 'null'
              format: date-time
              description: When the leader went ahead of every other player in the period.
          required:
            - userId
            - username
            - since
        biggestClimber:
          type:
            - object
            - 'null'
          description: The player who won the most places in the last 24 hours.
          properties:
            userId:
              type: string
              example: 66b9d6c2f1a2b3c4d5e6f7a8
            username:
              type: string
              example: jdoe
            places:
              type: integer
              example: 3
          required:
            - userId
            - username
            - places
        longestWinStreak:
          type:
            - object
            - 'null'
          description: The longest current win streak (at least 2 wins in a row).
          properties:
            userId:
              type: string
              example: 66b9d6c2f1a2b3c4d5e6f7a8
            username:
              type: string
              example: jdoe
            wins:
              type: integer
              example: 4
          required:
            - userId
            - username
            - wins
      required:
        - podium
        - leader
        - biggestClimber
        - longestWinStreak

    Room:
      type: object
      properties:
        id:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7a9
        code:
          type: string
          description: 6 characters, used to join the room.
          example: K7PX2M
        status:
          type: string
          enum:
            - waiting
            - playing
            - finished
        hostUserId:
          type: string
          description: ID of the user who hosts the room.
          example: 66b9d6c2f1a2b3c4d5e6f7a8
        settings:
          $ref: '#/components/schemas/Settings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - status
        - hostUserId
        - settings
        - createdAt
        - updatedAt

    Settings:
      type: object
      properties:
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 8
          default: 8
        rounds:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        turnDuration:
          type: integer
          description: Duration of a turn, in seconds.
          minimum: 30
          maximum: 180
          default: 80
        difficulty:
          type: string
          description: Difficulty of the words to draw. `mixed` picks words of every difficulty.
          enum:
            - mixed
            - easy
            - medium
            - hard
          default: mixed
      required:
        - maxPlayers
        - rounds
        - turnDuration
        - difficulty

    SettingsUpdate:
      type: object
      description: Same constraints as the settings, but all fields are optional.
      properties:
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 8
        rounds:
          type: integer
          minimum: 1
          maximum: 10
        turnDuration:
          type: integer
          minimum: 30
          maximum: 180
        difficulty:
          type: string
          enum:
            - mixed
            - easy
            - medium
            - hard
      example:
        rounds: 5
        difficulty: hard

    Participant:
      type: object
      properties:
        id:
          type: string
          description: ID of the participant.
          example: 66b9d6c2f1a2b3c4d5e6f7b0
        userId:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7a8
        username:
          type: string
          example: jdoe
        score:
          type: integer
          default: 0
        excluded:
          type: boolean
          description: true if the host excluded this player.
          default: false
        joinedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - username
        - score
        - excluded
        - joinedAt

    Drawing:
      type: object
      properties:
        id:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7c1
        participantId:
          type: string
          description: ID of the participant who draws.
          example: 66b9d6c2f1a2b3c4d5e6f7b0
        roundNumber:
          type: integer
          minimum: 1
          description: 'Round of the game (in a round, each player draws once).'
          example: 1
        word:
          type: string
          nullable: true
          description: The word to draw, only once the turn is finished (`null` before).
          example: éléphant
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: '`null` while the turn is not finished.'
      required:
        - id
        - participantId
        - roundNumber
        - word
        - startedAt
        - endedAt

    Guess:
      type: object
      properties:
        id:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7d2
        participantId:
          type: string
          description: ID of the participant who guessed.
          example: 66b9d6c2f1a2b3c4d5e6f7b0
        username:
          type: string
          nullable: true
          description: '`null` if the player has left the room.'
          example: jdoe
        content:
          type: string
          nullable: true
          description: The proposed word (`null` for a right guess while the turn is not finished).
          example: girafe
        isCorrect:
          type: boolean
          example: false
        points:
          type: integer
          minimum: 0
          description: Points won with this guess (0 if wrong).
          example: 0
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - participantId
        - username
        - content
        - isCorrect
        - points
        - createdAt

    GuessCreate:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 50
          example: girafe
      required:
        - content

    RoomStart:
      type: object
      properties:
        status:
          type: string
          enum:
            - playing
      required:
        - status

    ParticipantExclude:
      type: object
      properties:
        excluded:
          type: boolean
          enum:
            - true
      required:
        - excluded

    UserCreate:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: Must be unique. Spaces at the start and end are removed.
          example: jdoe
        email:
          type: string
          format: email
          description: Must be unique. Stored in lowercase.
          example: jdoe@example.com
        password:
          type: string
          minLength: 8
          example: password123
      required:
        - username
        - email
        - password

    UserUpdate:
      type: object
      description: Same constraints as for the creation, but all fields are optional.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
          example: jdoe@example.com
        password:
          type: string
          example: password123
      required:
        - email
        - password

    Token:
      type: object
      properties:
        token:
          type: string
          description: JWT to send in the `Authorization` header.
      required:
        - token

    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: 'User validation failed: email: Path `email` is invalid.'
        errors:
          type: object
          description: Details for each invalid field (only for schema validation errors).
          additionalProperties: true
      required:
        - message

  responses:
    BadRequest:
      description: The request body is malformed or a required field is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The token is missing, invalid or expired.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: A bearer token is required
    UserNotFound:
      description: The user of the token no longer exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: User not found
    Forbidden:
      description: The authenticated user is not allowed to do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Only the host of the room can do this
    RoomNotFound:
      description: No room has this code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Room not found
    ParticipantNotFound:
      description: No room has this code, or this room has no player with this ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Participant not found
    DrawingNotFound:
      description: No room has this code, or this room has no drawing with this ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Drawing not found
    NotAPlayer:
      description: The authenticated user is not a player of this room.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Only the players of the room can do this

    Conflict:
      description: The username or the email is already used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: A resource with the same value already exists
    ValidationError:
      description: Some fields are invalid (e.g. password too short, invalid email).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
