openapi: '3.1.0'

info:
  title: Devin'Art API
  description: >-
    REST API of **Devin'Art**, a multiplayer draw-and-guess game.
    One player draws a secret word while the others try to guess it as fast as possible.


    **Authentication:** log in with `POST /auth/login` to get a token, then send it
    in the `Authorization: Bearer <token>` header of protected requests.
    Tokens expire after 7 days.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: auth
    description: Authentication
  - name: users
    description: User accounts
  - name: rooms
    description: Game rooms
  - name: participants
    description: Players of a room

paths:
  /auth/login:
    post:
      summary: Log in.
      description: Returns a token to authenticate the next requests.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        200:
          description: The credentials are valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          description: The email or the password is wrong.
          headers:
            WWW-Authenticate:
              $ref: '#/components/headers/WWW-Authenticate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid email or password

  /users:
    post:
      summary: Register a new user.
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        201:
          description: The user was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/ValidationError'

  /users/me:
    get:
      summary: Get the authenticated user.
      tags:
        - users
      security:
        - bearerAuth: []
      responses:
        200:
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/UserNotFound'
    patch:
      summary: Update the authenticated user.
      description: Only the fields sent in the body are modified.
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        200:
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/UserNotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete the authenticated user.
      tags:
        - users
      security:
        - bearerAuth: []
      responses:
        204:
          description: The user was deleted.
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/UserNotFound'

  /rooms:
    post:
      summary: Create a room.
      description: >-
        The authenticated user becomes the host of the room, and its first player.
        A unique 6-character code is generated, and the settings get their default values.
      tags:
        - rooms
      security:
        - bearerAuth: []
      responses:
        201:
          description: The room was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/UserNotFound'

  /rooms/{code}:
    get:
      summary: Get a room.
      description: Only the players of the room can see it.
      tags:
        - rooms
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      responses:
        200:
          description: The room, with its settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/NotAPlayer'
        404:
          $ref: '#/components/responses/RoomNotFound'

  /rooms/{code}/settings:
    patch:
      summary: Update the settings of a room.
      description: >-
        Only the host can do it, and only before the game has started.
        Only the fields sent in the body are modified.
      tags:
        - rooms
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        200:
          description: The room, with its updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/RoomNotFound'
        409:
          description: The game has already started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The game has already started
        422:
          $ref: '#/components/responses/ValidationError'

  /rooms/{code}/participants:
    post:
      summary: Join a room.
      description: >-
        The authenticated user joins the room with its code.
        It is only possible before the game has started, if the room is not full,
        and if the user was not excluded from this room.
      tags:
        - participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      responses:
        201:
          description: The user joined the room.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: The user was excluded from this room by the host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: You were excluded from this room
        404:
          description: No room has this code, or the user of the token no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Room not found
        409:
          description: >-
            The user is already in the room, the game has already started, or the room is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The room is full
    get:
      summary: List the players of a room.
      description: >-
        Players are sorted by arrival (the first one is the earliest).
        Excluded players are not listed. Only the players of the room can see the list.
      tags:
        - participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      responses:
        200:
          description: The players of the room.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/NotAPlayer'
        404:
          $ref: '#/components/responses/RoomNotFound'

  /rooms/{code}/participants/{id}:
    patch:
      summary: Exclude a player.
      description: >-
        Only the host can do it. An excluded player cannot join the room again.
        The host cannot exclude themselves.
      tags:
        - participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
        - $ref: '#/components/parameters/ParticipantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantExclude'
      responses:
        200:
          description: The excluded player.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        400:
          description: 'The body is not `{ "excluded": true }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'The body must be { "excluded": true }'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: The user is not the host, or the host tries to exclude themselves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Only the host of the room can do this
        404:
          $ref: '#/components/responses/ParticipantNotFound'
    delete:
      summary: Leave a room.
      description: >-
        A player can only remove themselves.
        If the host leaves, the player who arrived the earliest becomes the new host.
        If the last player leaves, the room is deleted with its settings.
      tags:
        - participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomCode'
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        204:
          description: The player left the room.
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: The participant is not the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: You can only remove yourself from a room
        404:
          $ref: '#/components/responses/ParticipantNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RoomCode:
      name: code
      in: path
      required: true
      description: Code of the room (case insensitive).
      schema:
        type: string
        example: K7PX2M
    ParticipantId:
      name: id
      in: path
      required: true
      description: ID of the participant (not the ID of the user).
      schema:
        type: string
        example: 66b9d6c2f1a2b3c4d5e6f7b0

  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        example: /users/66b9d6c2f1a2b3c4d5e6f7a8
    WWW-Authenticate:
      description: How to authenticate.
      schema:
        type: string
        example: Bearer

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7a8
        username:
          type: string
          example: jdoe
        email:
          type: string
          format: email
          example: jdoe@example.com
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - createdAt
        - updatedAt

    Room:
      type: object
      properties:
        id:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7a9
        code:
          type: string
          description: 6 characters, used to join the room.
          example: K7PX2M
        status:
          type: string
          enum:
            - waiting
            - playing
            - finished
        hostUserId:
          type: string
          description: ID of the user who hosts the room.
          example: 66b9d6c2f1a2b3c4d5e6f7a8
        settings:
          $ref: '#/components/schemas/Settings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - status
        - hostUserId
        - settings
        - createdAt
        - updatedAt

    Settings:
      type: object
      properties:
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 8
          default: 8
        rounds:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        turnDuration:
          type: integer
          description: Duration of a turn, in seconds.
          minimum: 30
          maximum: 180
          default: 80
      required:
        - maxPlayers
        - rounds
        - turnDuration

    SettingsUpdate:
      type: object
      description: Same constraints as the settings, but all fields are optional.
      properties:
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 8
        rounds:
          type: integer
          minimum: 1
          maximum: 10
        turnDuration:
          type: integer
          minimum: 30
          maximum: 180

    Participant:
      type: object
      properties:
        id:
          type: string
          description: ID of the participant.
          example: 66b9d6c2f1a2b3c4d5e6f7b0
        userId:
          type: string
          example: 66b9d6c2f1a2b3c4d5e6f7a8
        username:
          type: string
          example: jdoe
        score:
          type: integer
          default: 0
        excluded:
          type: boolean
          description: true if the host excluded this player.
          default: false
        joinedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - username
        - score
        - excluded
        - joinedAt

    ParticipantExclude:
      type: object
      properties:
        excluded:
          type: boolean
          enum:
            - true
      required:
        - excluded

    UserCreate:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: Must be unique. Spaces at the start and end are removed.
          example: jdoe
        email:
          type: string
          format: email
          description: Must be unique. Stored in lowercase.
          example: jdoe@example.com
        password:
          type: string
          minLength: 8
          example: password123
      required:
        - username
        - email
        - password

    UserUpdate:
      type: object
      description: Same constraints as for the creation, but all fields are optional.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
          example: jdoe@example.com
        password:
          type: string
          example: password123
      required:
        - email
        - password

    Token:
      type: object
      properties:
        token:
          type: string
          description: JWT to send in the `Authorization` header.
      required:
        - token

    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: 'User validation failed: email: Path `email` is invalid.'
        errors:
          type: object
          description: Details for each invalid field (only for schema validation errors).
          additionalProperties: true
      required:
        - message

  responses:
    BadRequest:
      description: The request body is malformed or a required field is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The token is missing, invalid or expired.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: A bearer token is required
    UserNotFound:
      description: The user of the token no longer exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: User not found
    Forbidden:
      description: The authenticated user is not allowed to do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Only the host of the room can do this
    RoomNotFound:
      description: No room has this code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Room not found
    ParticipantNotFound:
      description: No room has this code, or this room has no player with this ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Participant not found
    NotAPlayer:
      description: The authenticated user is not a player of this room.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Only the players of the room can do this

    Conflict:
      description: The username or the email is already used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: A resource with the same value already exists
    ValidationError:
      description: Some fields are invalid (e.g. password too short, invalid email).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
